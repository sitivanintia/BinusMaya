plugins { id 'com.android.application' }
android {
    namespace 'com.introvertdreams.app'
    compileSdk 34
    defaultConfig { applicationId 'com.introvertdreams.app'; minSdk 24; targetSdk 34; versionCode 23; versionName '1.13.1' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    flavorDimensions += 'edition'
    productFlavors {
        // Pengguna: gate lisensi online, tanpa agent.
        user { dimension 'edition'; buildConfigField 'boolean', 'DEV_EDITION', 'false' }
        // Developer: tanpa gate lisensi, dashboard punya tab AI Agent (token admin) + diagnostik aktif.
        dev { dimension 'edition'; applicationIdSuffix '.dev'; versionNameSuffix '-dev'; resValue 'string', 'app_name', 'SESI MINI Dev'; buildConfigField 'boolean', 'DEV_EDITION', 'true' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
