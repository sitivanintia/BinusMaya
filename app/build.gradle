plugins { id 'com.android.application' }
android {
    namespace 'com.introvertdreams.app'
    compileSdk 34
    defaultConfig { applicationId 'com.introvertdreams.app'; minSdk 24; targetSdk 34; versionCode 14; versionName '1.9.1' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
