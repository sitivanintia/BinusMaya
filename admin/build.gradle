plugins { id 'com.android.application' }
android {
    namespace 'com.introvertdreams.sesiadmin'
    compileSdk 34
    defaultConfig { applicationId 'com.introvertdreams.sesiadmin'; minSdk 24; targetSdk 34; versionCode 2; versionName '1.0.1' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    constraints { implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'); implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') }
}
